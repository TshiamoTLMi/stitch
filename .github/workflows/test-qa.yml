name: Test branch QA

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dls_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            dls_app/android/**/*.gradle*
            dls_app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --concurrency=1

      - name: Build web QA bundle
        run: flutter build web --release

      - name: Configure Firebase-compatible Android debug key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "ANDROID_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Verify Firebase-compatible Android debug key
        run: |
          actual_sha1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA1: / { print $2 }' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_sha1='ec80aeae2291ff233c23f7fed1d7a990389fe383'
          if [ "$actual_sha1" != "$expected_sha1" ]; then
            printf 'Unexpected Android debug keystore SHA-1: %s\n' "${actual_sha1:-<missing>}" >&2
            exit 1
          fi

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Build Android QA APK
        run: flutter build apk --debug

      - name: Verify Android QA APK signing certificate
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          actual_sha1="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | awk -F': ' '/certificate SHA-1 digest:/ { print $NF }' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_sha1='ec80aeae2291ff233c23f7fed1d7a990389fe383'
          if [ "$actual_sha1" != "$expected_sha1" ]; then
            printf 'Unexpected Android QA APK SHA-1: %s\n' "$actual_sha1" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: test-web-${{ github.sha }}
          path: dls_app/build/web/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: test-android-${{ github.sha }}
          path: dls_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
