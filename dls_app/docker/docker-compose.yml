# Containerised Flutter toolchain for the DLS app.
#
# Run from this directory (compose resolves paths relative to this file):
#
#   cd docker
#   docker compose build              # build the image once
#   docker compose run --rm test      # analyze + unit tests
#   docker compose run --rm build-web # build/web
#   docker compose run --rm build-apk # build/app/outputs/flutter-apk/
#   docker compose run --rm shell     # interactive bash in the toolchain
#
# `context: ..` is the Flutter project root, which is the repository bind-mounted
# at /app. Note that `.dockerignore` must stay at the context root (the project
# root) because BuildKit only reads it from there.
#
# All services share the same image, so the toolchain is identical everywhere.
name: dls

services:
  # Analyze + full unit test suite. This is the gate that must pass before any
  # release build is attempted.
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    image: dls-flutter:3.41.6
    working_dir: /app
    volumes:
      - ..:/app
      # Keep generated output off the host bind mount: a bind mount from
      # Windows is slow and thousands of small files crawl through it.
      - build-output:/app/build
      - dart-tool:/app/.dart_tool
      - pub-cache:/root/.pub-cache
      - gradle-cache:/root/.gradle
      - android-sdk:/opt/android-sdk
    command: >
      bash -c "flutter pub get &&
               flutter analyze &&
               flutter test"
    # `flutter test` needs these to avoid false failures on a shared runner.
    environment:
      CI: "true"
      PUB_CACHE: /root/.pub-cache
      GRADLE_USER_HOME: /root/.gradle

  # Production web bundle. Copy build/web/ to any static host (Firebase
  # Hosting, Cloud Storage, nginx).
  build-web:
    image: dls-flutter:3.41.6
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    volumes:
      - ..:/app
      - build-output:/app/build
      - dart-tool:/app/.dart_tool
      - pub-cache:/root/.pub-cache
      - gradle-cache:/root/.gradle
      - android-sdk:/opt/android-sdk
    command: >
      bash -c "flutter pub get &&
               flutter build web --release"
    environment:
      CI: "true"
      PUB_CACHE: /root/.pub-cache
      GRADLE_USER_HOME: /root/.gradle

  # Signed release APK. Note: the release build type currently falls back to the
  # debug signing config until a real upload key is provisioned.
  build-apk:
    image: dls-flutter:3.41.6
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    volumes:
      - ..:/app
      - build-output:/app/build
      - dart-tool:/app/.dart_tool
      - pub-cache:/root/.pub-cache
      - gradle-cache:/root/.gradle
      - android-sdk:/opt/android-sdk
    command: >
      bash -c "flutter pub get &&
               flutter build apk --release"
    environment:
      CI: "true"
      PUB_CACHE: /root/.pub-cache
      GRADLE_USER_HOME: /root/.gradle

  # Interactive shell for one-off commands (codegen, doctor, manual tests).
  shell:
    image: dls-flutter:3.41.6
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    volumes:
      - ..:/app
      - build-output:/app/build
      - dart-tool:/app/.dart_tool
      - pub-cache:/root/.pub-cache
      - gradle-cache:/root/.gradle
      - android-sdk:/opt/android-sdk
    environment:
      PUB_CACHE: /root/.pub-cache
      GRADLE_USER_HOME: /root/.gradle
    stdin_open: true
    tty: true
    command: bash

# Named volumes keep the expensive downloads (pub packages, Gradle
# distribution, Android platform images) across container rebuilds.
volumes:
  build-output:
  dart-tool:
  pub-cache:
  gradle-cache:
  android-sdk:
