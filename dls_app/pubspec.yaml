name: dls_app
description: Digital Lesela Sete - AI-powered wardrobe and personal stylist app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  image_picker: ^1.1.2
  image_cropper: ^12.2.0
  flutter_image_compress: ^2.4.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  provider: ^6.1.2
  intl: ^0.19.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  image: ^4.5.4
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  device_calendar: ^4.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/dls_logo.png"
  web:
    generate: true
    background_color: "#000000"
    theme_color: "#000000"
  image_path: "assets/icons/dls_logo.png"
