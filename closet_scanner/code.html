<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">

<div class="relative w-[80%] aspect-[3/4] max-w-md rounded-xl border-2 border-tertiary/40 flex items-center justify-center">

<div class="absolute -top-1 -left-1 w-8 h-8 border-t-4 border-l-4 border-tertiary rounded-tl-lg"></div>

<div class="absolute -bottom-1 -left-1 w-8 h-8 border-b-4 border-l-4 border-tertiary rounded-bl-lg"></div>

<div class="absolute inset-x-0 h-[2px] bg-tertiary/60 shadow-[0_0_15px_#a5fa00] top-1/4 animate-pulse"></div>

<div class="bg-surface-container-high/80 backdrop-blur-xl px-4 py-2 rounded-full flex items-center gap-2 border-l-2 border-tertiary transform translate-x-4">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>

</div>
</div>
</div>

</div>

<div class="absolute inset-0 rounded-full border-[3px] border-primary-container p-1 shadow-[0_0_20px_rgba(212,175,55,0.4)]">
<div class="w-full h-full rounded-full border border-primary/20"></div>
</div>
<!-- Inner Solid -->
<div class="w-[70%] h-[70%] rounded-full bg-on-background flex items-center justify-center">
<div class="w-[85%] h-[85%] rounded-full border border-surface-dim/20"></div>
</div>
</button>

</div>
